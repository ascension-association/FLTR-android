name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generated drawables are up to date
        run: |
          python3 tools/svg2vector.py
          git diff --exit-code app/src/main/res/drawable
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fltr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
